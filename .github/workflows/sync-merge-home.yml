name: Sync merge_home.riv

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-merge-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge
        uses: actions/checkout@v4
        with:
          path: merge

      - name: Checkout mergegr
        uses: actions/checkout@v4
        with:
          repository: xiaoQDR/mergegr
          ref: main
          path: mergegr

      - name: Copy Rive asset
        run: cp mergegr/assets/rive/merge_home.riv merge/public/rive/merge/merge_home.riv

      - name: Commit synced asset
        working-directory: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rive/merge/merge_home.riv
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync merge_home.riv from mergegr [skip ci]'
          git push
