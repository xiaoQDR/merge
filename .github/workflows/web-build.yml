name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync_asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge
        uses: actions/checkout@v4
        with:
          ref: main
          path: merge

      - name: Checkout mergegr
        uses: actions/checkout@v4
        with:
          repository: xiaoQDR/mergegr
          ref: main
          path: mergegr

      - name: Copy and commit merge_home.riv
        working-directory: merge
        run: |
          cp ../mergegr/assets/rive/merge_home.riv public/rive/merge/merge_home.riv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rive/merge/merge_home.riv
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync merge_home.riv from mergegr [skip ci]'
          git push

  build:
    needs: sync_asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
